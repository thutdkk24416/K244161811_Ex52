<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="CONTACT.HTML" method="GET">
        <h3>Contact the editorial office</h3>
        <p>Full name <br/>
            <input type="text" name="fullname" style="width: 100%;">
        </p>
        <table style="width: 100%;">
            <tr>
                <td>Email</td>
                <td>Send to</td>
            </tr>
            <tr>
                <td><input type="email" name="email" style="width: 95%;"></td>
                <td><select name="sento" style="width: 100%;">
                    <option value="editorial">Editorial board</option>
                    <option value="news">News Department</option>
                    <option value="perspectives">Board of Perspectives</option>
                    <option value="world">World Board</option>
                    <option value="business">Business Department</option>
                </select>
                </td>
            </tr>
        </table>
        <p>Title <br/>
            <input type="text" name="title" style="width: 100%;">
        </p>
        <p>Content <br/>
            <textarea name="content" style="width: 100%;" rows="5"></textarea>
        </p>
        <button type="submit" style="background-color: rgb(179, 31, 31); color: white; padding: 5px 20px; border-radius: 5px;">Send</button>
    </form>
</body>
</html>
